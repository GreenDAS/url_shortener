# File: compose.yaml
# Version: V1.3
# Description: Runs the app container (Gunicorn). MySQL is NOT in here, it
#              runs on the host laptop like the course spec asks (DB-1).
#              Start with: docker compose up --build -d
#              Settings come from the .env file (copy .env.example first).
#
#              One service:
#                web = this repo's Dockerfile, Gunicorn on port 5000
#              The app reaches the laptop's MySQL (port 3306) through the
#              name host.docker.internal, which the extra_hosts line below
#              points at the host (DOC-5, DB-2). MySQL has to be running on
#              the laptop before the app is used, Compose can't start it.
#              One time MySQL setup: docs/specs/host-mysql.md
#              Spec sheet: docs/specs/app-startup.md
# ----------------------------------------------------------------------------
services:
  web:
    build: .  # Builds From The Dockerfile In This Folder
    image: url_shortener
    container_name: url_shortener_web
    ports:
      - "5000:5000"  # Publishes The Gunicorn Port On The Host (DOC-4)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Lets The Container Reach The Host's MySQL (DOC-5)
    restart: unless-stopped  # Comes Back After A Crash Or Reboot Unless Stopped By Hand
