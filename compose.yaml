# ----------------------------------------------------------------------------
# Author: Daniel S.
# Date: 11/10/2026
# File: compose.yaml
# Version: V1.1
# Description: Runs the app container (Gunicorn) and the MySQL container.
#              Start with: docker compose up --build -d
#              Settings come from the .env file (copy .env.example first).
# ----------------------------------------------------------------------------
services:
  web:
    build: .
    image: url_shortener
    container_name: url_shortener_web
    ports:
      - "5000:5000"  # Publishes The Gunicorn Port On The Host (DOC-4)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Lets The Container Reach The Host (DOC-5)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: url_shortener_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}  # Dedicated App User, Allowed From Any Host (DB-3, DB-4)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"  # 3307 On The Host So It Doesn't Clash With The Local MySQL On 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
