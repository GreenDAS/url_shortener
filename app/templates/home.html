{% extends "base.html" %}
<!--
  ----------------------------------------------------------------------------
  Author: Daniel S.
  Date: 11/13/2026
  File: app/templates/home.html
  Version: V1.0
  Description: The home page (/ and /index). The header with the user picker
               comes from base.html. With no current user, this page asks me
               to pick or add one (URL-13).

  AI Use:      Claude (AI) was used to create this file. Prompt used:
               "Please create a GUI for my URL_Shortener Project given my
               Jira for spec/requirements and the GitHub for controls. Make
               note of any controls not implemented yet that need to be."

  Controls Not Implemented Yet:
               List of my links with a Delete button  -> URL-15
               Create short link form                 -> URL-14
               Custom alias box on that form          -> URL-22

  What Flask Passes In: see base.html
  Spec sheet: docs/specs/home-page.md
  ----------------------------------------------------------------------------
-->
{% block content %}
  {% if not user %}
  <!-- Nobody Picked Yet (Or The Picked User No Longer Exists) -->
  <h2>Welcome</h2>
  <p>Pick a user from the "Switch user" list above, or add a new one, to get started.</p>
  {% else %}
  <h2>{{ user.username }}'s links</h2>
  <p>The list of links and the create form are not built yet (URL-15, URL-14).</p>
  {% endif %}
{% endblock %}
